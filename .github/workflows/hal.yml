name: Hal fiyatlarini cek

on:
  schedule:
    - cron: "7,37 2-10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape
      - name: Değiştiyse kaydet
        run: |
          git config user.name "hal-bot"
          git config user.email "hal-bot@users.noreply.github.com"
          git add hal.json
          git diff --cached --quiet || (git commit -m "Hal fiyatları $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')" && git push)
